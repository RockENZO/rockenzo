<svg xmlns="http://www.w3.org/2000/svg" width="360" height="325" viewBox="0 0 360 325" role="img" aria-label="Five more projects"><path d="M0.5 14.5 A14 14 0 0 1 14.5 0.5 H345.5 A14 14 0 0 1 359.5 14.5 V310.5 A14 14 0 0 1 345.5 324.5 H14.5 A14 14 0 0 1 0.5 310.5 Z" fill="#F7F6FC"/><text x="16" y="32" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" font-weight="600" xml:space="preserve">odyssey</text><text x="16" y="52" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">a terminal coding agent with 17 tools and</text><text x="16" y="69" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">local Ollama inference</text><text x="16" y="96" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" font-weight="600" xml:space="preserve">MagicTrick</text><text x="16" y="116" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">an iOS card trick with no buttons, only</text><text x="16" y="133" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">rotate, shake and a secret tap</text><text x="16" y="160" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" font-weight="600" xml:space="preserve">ControllerMouse</text><text x="16" y="180" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">drive your Mac&#x27;s cursor with a game</text><text x="16" y="197" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">controller from the menu bar</text><text x="16" y="224" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" font-weight="600" xml:space="preserve">Road_Semantic_Segmentation_CV</text><text x="16" y="244" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">PyTorch segmentation for driving scenes,</text><text x="16" y="261" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">with mIoU and FLOPs ablations</text><text x="16" y="288" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" font-weight="600" xml:space="preserve">flappy_bird_dqn-main</text><text x="16" y="308" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">a DQN agent that learns to play Flappy Bird</text><path d="M0.5 14.5 A14 14 0 0 1 14.5 0.5 H345.5 A14 14 0 0 1 359.5 14.5 V310.5 A14 14 0 0 1 345.5 324.5 H14.5 A14 14 0 0 1 0.5 310.5 Z" fill="none" stroke="#D9D5EC"/></svg>