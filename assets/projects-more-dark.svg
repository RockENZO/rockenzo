<svg xmlns="http://www.w3.org/2000/svg" width="880" height="156" viewBox="0 0 880 156" role="img" aria-label="Five more projects"><rect width="880" height="156" fill="#0D1B33"/><text x="16" y="32" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" font-weight="600" xml:space="preserve">odyssey</text><text x="268.0" y="32" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">a terminal coding agent with 17 tools and local Ollama inference</text><text x="16" y="58" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" font-weight="600" xml:space="preserve">MagicTrick</text><text x="268.0" y="58" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">an iOS card trick with no buttons, only rotate, shake and a secret tap</text><text x="16" y="84" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" font-weight="600" xml:space="preserve">ControllerMouse</text><text x="268.0" y="84" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">drive your Mac&#x27;s cursor with a game controller from the menu bar</text><text x="16" y="110" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" font-weight="600" xml:space="preserve">Road_Semantic_Segmentation_CV</text><text x="268.0" y="110" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">PyTorch segmentation for driving scenes, with mIoU and FLOPs ablations</text><text x="16" y="136" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" font-weight="600" xml:space="preserve">flappy_bird_dqn-main</text><text x="268.0" y="136" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">a DQN agent that learns to play Flappy Bird</text><path d="M0 155.5H880" stroke="#1E2D4D"/></svg>