space,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">reproducible integration tests.</text><rect x="440" y="68" width="440" height="149" fill="#0D1B33"/><rect x="440" y="68" width="440" height="26" fill="#0F2140"/><text x="454" y="85" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#8B9BB4" xml:space="preserve">NLP-Cyber-Harm-Detection</text><path d="M440 94.5H880" stroke="#1E2D4D"/><text x="454" y="118" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" xml:space="preserve">CSIRO&#x27;s Data61</text><text x="454" y="150" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">Nine-class scam detection with macro F1 0.948 on an</text><text x="454" y="167" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">18,261-record, template-grouped internal test.</text><path d="M0 217.5H880" stroke="#1E2D4D"/><rect x="0" y="217" width="440" height="149" fill="#0D1B33"/><rect x="0" y="217" width="440" height="26" fill="#0F2140"/><text x="14" y="234" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#8B9BB4" xml:space="preserve">data</text><path d="M439.5 217V366" stroke="#1E2D4D"/><path d="M0 243.5H440" stroke="#1E2D4D"/><text x="14" y="267" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" xml:space="preserve">Fraud dataset</text><text x="14" y="299" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">A reproducible corpus of 194,913 scam and legitimate</text><text x="14" y="316" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">samples from 19 retained source datasets, with</text><text x="14" y="333" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">verified hashes.</text><rect x="440" y="217" width="440" height="149" fill="#0D1B33"/><rect x="440" y="217" width="440" height="26" fill="#0F2140"/><text x="454" y="234" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#8B9BB4" xml:space="preserve">Automatic-web-scraper-with-LLM-parsing</text><path d="M440 243.5H880" stroke="#1E2D4D"/><text x="454" y="267" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" xml:space="preserve">LLM web scraper</text><text x="454" y="299" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">Local LLMs extract structured webpage data with</text><text x="454" y="316" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">traceable source evidence. Field exact-match F1</text><text x="454" y="333" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">0.938 on 16 synthetic HTML fixtures.</text><path d="M0 366.5H880" stroke="#1E2D4D"/><rect x="0" y="366" width="440" height="149" fill="#0D1B33"/><rect x="0" y="366" width="440" height="26" fill="#0F2140"/><text x="14" y="383" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#8B9BB4" xml:space="preserve">MyWeather</text><path d="M439.5 366V515" stroke="#1E2D4D"/><path d="M0 392.5H440" stroke="#1E2D4D"/><text x="14" y="416" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" xml:space="preserve">MyWeather</text><text x="14" y="448" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">SwiftUI weather app with location-based</text><text x="14" y="465" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">OpenWeatherMap forecasts, animated transitions and</text><text x="14" y="482" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">Liquid Glass cards.</text><rect x="440" y="366" width="440" height="149" fill="#0D1B33"/><rect x="440" y="366" width="440" height="26" fill="#0F2140"/><text x="454" y="383" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#8B9BB4" xml:space="preserve">ML-object-detection-project</text><path d="M440 392.5H880" stroke="#1E2D4D"/><text x="454" y="416" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#A78BFA" xml:space="preserve">Football match analysis</text><text x="454" y="448" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">Experimental YOLOv8s football detection, player</text><text x="454" y="465" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">tracking and pitch mapping, with a match viewer for</text><text x="454" y="482" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#E8EDF8" xml:space="preserve">one 30-second clip.</text><path d="M0 515.5H880" stroke="#1E2D4D"/></g><path d="M0.5 516.0 V14.5 A14 14 0 0 1 14.5 0.5 H865.5 A14 14 0 0 1 879.5 14.5 V516.0" fill="none" stroke="#1E2D4D"/></svg>