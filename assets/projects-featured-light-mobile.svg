<svg xmlns="http://www.w3.org/2000/svg" width="360" height="980" viewBox="0 0 360 980" role="img" aria-label="Featured projects, shown as split terminal panes"><defs><clipPath id="win"><path d="M0.5 14.5 A14 14 0 0 1 14.5 0.5 H345.5 A14 14 0 0 1 359.5 14.5 V979.5 H0.5 Z"/></clipPath></defs><g clip-path="url(#win)"><rect width="360" height="980" fill="#F7F6FC"/><rect x=".5" y=".5" width="359" height="0" rx="14" fill="#F7F6FC"/><path d="M.5 14.5 A14 14 0 0 1 14.5 .5 H345.5 A14 14 0 0 1 359.5 14.5 V28.5 H.5 Z" fill="#ECE8FB"/><circle cx="14.5" cy="14.5" r="5.5" fill="#FF5F57"/><circle cx="34.5" cy="14.5" r="5.5" fill="#FEBC2E"/><circle cx="54.5" cy="14.5" r="5.5" fill="#28C840"/><text text-anchor="middle" x="180.0" y="18.5" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#59627F" xml:space="preserve">Projects</text><path d="M0 28.5H360" stroke="#D9D5EC"/><text x="16" y="54" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="14" fill="#B45F06" xml:space="preserve">~ $ ls projects/ --featured</text><path d="M0 68.5H360" stroke="#D9D5EC"/><rect x="0" y="68" width="360" height="149" fill="#F7F6FC"/><rect x="0" y="68" width="360" height="26" fill="#FBFAFF"/><text x="14" y="85" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">datapipeline-etl</text><path d="M0 94.5H360" stroke="#D9D5EC"/><text x="14" y="118" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">Knia Maps</text><text x="14" y="150" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">Geospatial ETL for Sydney accessibility</text><text x="14" y="167" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">mapping, with Elasticsearch, PostgreSQL and</text><text x="14" y="184" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">Docker, plus reproducible integration tests.</text><path d="M0 217.5H360" stroke="#D9D5EC"/><rect x="0" y="217" width="360" height="149" fill="#F7F6FC"/><rect x="0" y="217" width="360" height="26" fill="#FBFAFF"/><text x="14" y="234" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">NLP-Cyber-Harm-Detection</text><path d="M0 243.5H360" stroke="#D9D5EC"/><text x="14" y="267" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">CSIRO&#x27;s Data61</text><text x="14" y="299" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">Nine-class scam detection with macro F1</text><text x="14" y="316" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">0.948 on an 18,261-record, template-grouped</text><text x="14" y="333" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">internal test.</text><path d="M0 366.5H360" stroke="#D9D5EC"/><rect x="0" y="366" width="360" height="149" fill="#F7F6FC"/><rect x="0" y="366" width="360" height="26" fill="#FBFAFF"/><text x="14" y="383" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">data</text><path d="M0 392.5H360" stroke="#D9D5EC"/><text x="14" y="416" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">Fraud dataset</text><text x="14" y="448" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">A reproducible corpus of 194,913 scam and</text><text x="14" y="465" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">legitimate samples from 19 retained source</text><text x="14" y="482" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">datasets, with verified hashes.</text><path d="M0 515.5H360" stroke="#D9D5EC"/><rect x="0" y="515" width="360" height="166" fill="#F7F6FC"/><rect x="0" y="515" width="360" height="26" fill="#FBFAFF"/><text x="14" y="532" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">Automatic-web-scraper-with-LLM-parsing</text><path d="M0 541.5H360" stroke="#D9D5EC"/><text x="14" y="565" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">LLM web scraper</text><text x="14" y="597" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">Local LLMs extract structured webpage data</text><text x="14" y="614" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">with traceable source evidence. Field exact-</text><text x="14" y="631" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">match F1 0.938 on 16 synthetic HTML</text><text x="14" y="648" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">fixtures.</text><path d="M0 681.5H360" stroke="#D9D5EC"/><rect x="0" y="681" width="360" height="149" fill="#F7F6FC"/><rect x="0" y="681" width="360" height="26" fill="#FBFAFF"/><text x="14" y="698" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">MyWeather</text><path d="M0 707.5H360" stroke="#D9D5EC"/><text x="14" y="731" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">MyWeather</text><text x="14" y="763" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">SwiftUI weather app with location-based</text><text x="14" y="780" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">OpenWeatherMap forecasts, animated</text><text x="14" y="797" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">transitions and Liquid Glass cards.</text><path d="M0 830.5H360" stroke="#D9D5EC"/><rect x="0" y="830" width="360" height="149" fill="#F7F6FC"/><rect x="0" y="830" width="360" height="26" fill="#FBFAFF"/><text x="14" y="847" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="11" fill="#59627F" xml:space="preserve">ML-object-detection-project</text><path d="M0 856.5H360" stroke="#D9D5EC"/><text x="14" y="880" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="13" fill="#6B4FD3" xml:space="preserve">Football match analysis</text><text x="14" y="912" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">Experimental YOLOv8s football detection,</text><text x="14" y="929" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">player tracking and pitch mapping, with a</text><text x="14" y="946" font-family="Menlo,Consolas,ui-monospace,monospace" font-size="12" fill="#1B2340" xml:space="preserve">match viewer for one 30-second clip.</text><path d="M0 979.5H360" stroke="#D9D5EC"/></g><path d="M0.5 980.0 V14.5 A14 14 0 0 1 14.5 0.5 H345.5 A14 14 0 0 1 359.5 14.5 V980.0" fill="none" stroke="#D9D5EC"/></svg>