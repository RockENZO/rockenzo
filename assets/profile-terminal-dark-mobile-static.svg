<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1002" viewBox="0 0 360 1002" role="img" aria-labelledby="title desc"><title id="title">RockENZO — animated terminal profile</title><desc id="desc">Original ASCII-filled geometric ROCK lettering over animated ASCII waves. Master of IT (Applied AI) at Adelaide University; Bachelor of IT at University of Adelaide, 2025. Focus: web development, scalable apps, AI and ML. Core: Python, React, Vue, Elasticsearch, Docker, Streamlit. AI and ML: PyTorch, TensorFlow, scikit-learn, Pandas, NumPy. LLM tools: Codex, Claude Code, DeepSeek Harness, Hugging Face and Ollama. Asynchronously suspended geometric letters with an ASCII-text fill sit over a decorative, multi-source ASCII interference background. Reveal and cursor effects do not execute commands or represent live system activity.</desc><style>.motion{display:none}.still{display:inline}</style><rect x=".5" y=".5" width="359" height="1001" rx="12" fill="#10151b" stroke="#303943" /><path d="M1 46H359" stroke="#303943" /><g font-family="Menlo,Consolas,monospace"><text x="22" y="29" font-size="12" fill="#9ba7ad">ROCK / FIELD NOTES</text><text x="248" y="29" font-size="11" fill="#9ba7ad">PROFILE 01</text><g transform="translate(28,-28) scale(.85)"><g font-family="Menlo,Consolas,monospace" aria-label="Flat geometric ROCK over an open ASCII wave field"><defs><g id="glyph-R"><path d="M0,0 L43,0 L57,14 L57,36 L44,49 L35,49 L59,78 L43,78 L20,49 L12,49 L12,78 L0,78 Z M12,12 L38,12 L45,19 L45,31 L38,38 L12,38 Z" transform="translate(74 145)" fill-rule="evenodd" /></g><g id="glyph-O"><path d="M14,0 L44,0 L58,14 L58,64 L44,78 L14,78 L0,64 L0,14 Z M18,12 L40,12 L46,18 L46,60 L40,66 L18,66 L12,60 L12,18 Z" transform="translate(195 145)" fill-rule="evenodd" /></g><g id="glyph-C"><path d="M14,0 L58,0 L58,12 L18,12 L12,18 L12,60 L18,66 L58,66 L58,78 L14,78 L0,64 L0,14 Z" transform="translate(74 266)" fill-rule="evenodd" /></g><g id="glyph-K"><path d="M0,0 L12,0 L12,31 L42,0 L58,0 L23,